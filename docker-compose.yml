# Rinha do Placar. Soma dos limites: 1,5 CPU e 3000 MB.
# lb 0,1 + api01 0,3 + api02 0,3 + redis 0,8 = 1,5
# 32 + 128 + 128 + 2712 = 3000 MB

services:
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "9999:9999"
    depends_on:
      - api01
      - api02
    deploy:
      resources:
        limits:
          cpus: "0.1"
          memory: "32MB"

  api01: &api
    build: ./api
    image: rinha-placar-api:local
    environment:
      PORT: "8080"
      REDIS_URL: "redis://redis:6379"
    depends_on:
      - redis
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: "128MB"

  api02:
    <<: *api

  redis:
    image: redis:7.4-alpine
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 2gb
      - --maxmemory-policy
      - noeviction
      - --protected-mode
      - "no"
    deploy:
      resources:
        limits:
          cpus: "0.8"
          memory: "2712MB"
