worker_processes 1;

events {
    worker_connections 1024;
}

http {
    access_log off;

    upstream api {
        zone api 64k;
        server api01:8080 max_fails=1 fail_timeout=30s;
        server api02:8080 max_fails=1 fail_timeout=30s;
        keepalive 200;
        keepalive_requests 100000;
    }

    server {
        listen 9999;

        location / {
            proxy_pass http://api;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_connect_timeout 300ms;
            proxy_next_upstream error timeout;
            proxy_buffering off;
        }
    }
}
