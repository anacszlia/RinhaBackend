[package]
name = "api"
version = "0.1.0"
edition = "2021"
publish = false

[[bin]]
name = "api"
path = "src/main.rs"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["macros", "rt", "net", "time"] }
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
serde_json = "1"

[profile.release]
strip = true
